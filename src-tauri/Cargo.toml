[package]
name = "satloc"
version = "0.1.0"
description = "Earth from space with satellites in real time, focused on ImageSat International (ISI)."
authors = ["Shahar"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The library crate is what Tauri's mobile targets link against; keep the desktop binary thin.
name = "satloc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
