[package]
name = "satloc"
version = "0.2.1"
description = "Earth from space with satellites in real time, focused on ImageSat International (ISI)."
authors = ["Shahar"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The library crate is what Tauri's mobile targets link against; keep the desktop binary thin.
name = "satloc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: F12 / Ctrl+Shift+I also in release builds, so problems on a user machine can be inspected.
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-http = "2"
# "Report a problem" opens GitHub in the system browser.
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Self-update from GitHub Releases (desktop only).
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Remembers window size, position and maximised state between launches.
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
