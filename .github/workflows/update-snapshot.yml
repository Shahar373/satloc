name: Update ISI TLE snapshot

# Keeps the bundled element sets fresh so a first launch without network still shows the
# ISI satellites at roughly the right place. Commits only when CelesTrak published new data.
#
# Scoped to the repository's default branch only: no push trigger, an explicit checkout of
# github.event.repository.default_branch, and a job-level guard that skips (no checkout, no
# write) if the run's ref isn't actually the default branch. A manual run picked against a
# feature branch ends as skipped rather than writing to it.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  TARGET_BRANCH: ${{ github.event.repository.default_branch }}

permissions:
  contents: read

concurrency:
  group: update-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-snapshot.mjs
      - name: Commit the refreshed snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/isi-snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
          else
            git commit -m "data: refresh ISI TLE snapshot [skip ci]"
            # Something may have landed on the branch while the job ran.
            git pull --rebase origin "$TARGET_BRANCH"
            git push origin "HEAD:$TARGET_BRANCH"
          fi
