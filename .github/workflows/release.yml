name: Release

# Publishes a GitHub Release with installers, updater signatures and latest.json (the installed
# app checks that file and offers the update). Runs when:
#   - a tag `vX.Y.Z` is pushed, or
#   - the version in src-tauri/tauri.conf.json changes on a push (the release is named after it), or
#   - it is started by hand from the Actions tab.
# A version that already has a published release is skipped. Needs the repository secrets
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
#
# Shape: `prepare` creates ONE draft release up front, every platform build uploads into it by id
# (tauri-action merges latest.json across platforms when given a release id), and `publish` flips
# the draft to published only once every platform built. Letting each platform's tauri-action
# find-or-create the release by tag instead made the two builds race: v0.5.0's Linux job finished a
# second after Windows, tried to create the same release, and failed with "Published releases must
# have a valid tag" — leaving a published release with Windows assets only and a latest.json that
# never learned about Linux. A build failure now leaves a draft (reused by the next run) rather than
# a half-published `latest`.
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths:
      - src-tauri/tauri.conf.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

# One release at a time: a bump commit pushed together with its tag must not race itself.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Decide the release tag
    # Version bumps publish only from the default branch (a feature branch must not become releases/latest).
    if: github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          conf="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ "$tag" != "$conf" ]]; then
              echo "Tag $tag does not match the version in src-tauri/tauri.conf.json ($conf); bump the version first."
              exit 1
            fi
          else
            tag="$conf"
          fi
          node scripts/check-versions.mjs
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # A published release for this tag means nothing to do; a draft (left by a run whose
          # build failed) is reused below rather than duplicated.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          case "$code" in
            200)
              echo "Release $tag is already published; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "Will publish $tag."
              echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "GitHub API returned HTTP $code while looking for release $tag; not publishing blindly."
              exit 1 ;;
          esac
      - id: create
        name: Create (or reuse) the draft release
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          node scripts/release-notes.mjs "$TAG" > /tmp/notes.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
                 --jq "map(select(.draft and .tag_name == \"$TAG\")) | .[0].id // empty")
          if [[ -n "$id" ]]; then
            echo "Reusing draft release $id for $TAG (left by an earlier run)."
          else
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
                   -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="SatLoc $TAG" \
                   -F draft=true -F prerelease=false -F body=@/tmp/notes.md --jq '.id')
            echo "Created draft release $id for $TAG."
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build and publish
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          # macOS costs 10x CI minutes on private repositories; enable when needed:
          # - platform: macos-latest
          #   args: '--target aarch64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # Bundle element sets that are minutes old, not whatever was last committed (best effort: the
      # committed snapshot is the fallback when CelesTrak is unreachable from the runner).
      - run: node scripts/update-snapshot.mjs
        continue-on-error: true
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Upload into the draft `prepare` created; tauri-action merges latest.json across the
          # platforms when it is given an existing release id.
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: satloc-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  publish:
    name: Publish the release
    needs: [prepare, build]
    if: always() && needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish only once every platform built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$BUILD_RESULT" != "success" ]]; then
            echo "::error::A platform build did not succeed ($BUILD_RESULT). Release $TAG stays a draft (id $RELEASE_ID) so the updater never sees a partial release. Fix the failure and re-run this workflow; the draft is reused."
            exit 1
          fi
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --jq '.html_url'
