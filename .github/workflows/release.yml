name: Release

# Publishes a GitHub Release with installers, updater signatures and latest.json (the installed
# app checks that file and offers the update). Runs when:
#   - a tag `vX.Y.Z` is pushed, or
#   - the version in src-tauri/tauri.conf.json changes on a push (the release is named after it), or
#   - it is started by hand from the Actions tab.
# A version that already has a release is skipped. Needs the repository secrets
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
on:
  push:
    tags: ['v*']
    branches: ['**']
    paths:
      - src-tauri/tauri.conf.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    name: Decide the release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.decide.outputs.tag }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag")
          case "$code" in
            200)
              echo "Release $tag already exists; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT" ;;
            404)
              echo "Will publish $tag."
              echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "GitHub API returned HTTP $code while looking for release $tag; not publishing blindly."
              exit 1 ;;
          esac

  build:
    name: Build and publish
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          # macOS costs 10x CI minutes on private repositories; enable when needed:
          # - platform: macos-latest
          #   args: '--target aarch64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux webview dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: SatLoc ${{ needs.prepare.outputs.tag }}
          releaseBody: 'Installers built by GitHub Actions. Windows: use the .exe (NSIS) installer. Installed copies update themselves from this release.'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: satloc-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
